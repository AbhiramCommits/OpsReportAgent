[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsreportagent"
version = "0.1.0"
description = "Document-to-reporting pipeline for retail store operations: ingest, LLM extraction, scoring, and weekly rollups."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "OpsReportAgent" }]
dependencies = [
    "langchain==1.4.6",
    "langchain-core==1.6.10",
    "langchain-openai==1.7.2",
    "langchain-anthropic==1.7.6",
    "langgraph==1.2.15",
    "sqlalchemy==2.1.4",
    "psycopg2-binary==2.9.13",
    "pandas==3.0.6",
    "numpy==2.4.6",
    "matplotlib==3.11.2",
    "jinja2==3.1.6",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "typer==0.27.3",
    "pyyaml==6.0.3",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "reportlab==5.0.1",
    "fpdf2==2.8.9",
]

[project.scripts]
opsreport = "opsreportagent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsreportagent = ["prompts/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/opsreportagent"]
omit = ["src/opsreportagent/__main__.py"]

[tool.coverage.report]
show_missing = true
