name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (python 3.11, stub LLM)
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: stub
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests with coverage
        run: pytest -q --cov=src/opsreportagent --cov-report=term-missing --cov-fail-under=85

  end-to-end-demo:
    name: scheduled weekly job on the synthetic corpus
    runs-on: ubuntu-latest
    needs: test
    env:
      LLM_PROVIDER: stub
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerate the synthetic corpus
        run: python scripts/make_corpus.py

      - name: Ingest + extract + score + report (one command)
        run: opsreport schedule --weekly --run-id run-ci

      - name: Show the scorecard
        run: opsreport score --run-id run-ci

      - name: Compare prompt v1 vs v2
        run: |
          opsreport run --run-id run-ci-v2 --prompt-version v2
          opsreport compare-runs --a run-ci --b run-ci-v2

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports/
          if-no-files-found: error
