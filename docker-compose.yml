services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: opsreport
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d opsreport"]
      interval: 3s
      timeout: 3s
      retries: 25

  app:
    build: .
    environment:
      LLM_PROVIDER: stub
      DATABASE_URL: postgresql+psycopg2://ops:ops@postgres:5432/opsreport
      TEMPLATES_DIR: /app/templates
      CORPUS_DIR: /app/data/corpus
      GOLD_DIR: /app/data/gold
      REPORTS_DIR: /app/reports
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./templates:/app/templates
    command: ["schedule", "--weekly", "--run-id", "run-docker"]

volumes:
  pgdata:
